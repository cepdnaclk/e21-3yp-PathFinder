  </g>
  <g transform="translate(360 115)" filter="url(#glow)">
    <rect x="70" y="20" width="340" height="550" rx="38" fill="#071421" stroke="#57d9ff" stroke-width="4"/>
    <rect x="106" y="70" width="268" height="350" rx="26" fill="#10283f" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="180" cy="165" r="48" fill="none" stroke="url(#accent)" stroke-width="14"/>
    <circle cx="180" cy="165" r="18" fill="#57d9ff"/>
    <rect x="240" y="128" width="90" height="22" rx="11" fill="#51e19a"/>
